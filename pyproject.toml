[project]
name = "ecc-python-sample"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
# target-version は requires-python (>=3.14) から自動で決まる
line-length = 88
# Claude 向けの指示文書 (.md 内のコード例) を整形・lint の対象外にする
extend-exclude = [".claude", "CLAUDE.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # 行の長さは ruff format に任せる
]
# Edit を重ねている途中で、追加したばかりの import が消されないようにする
unfixable = ["F401"]
